    <script>
      (function() {
        const isViteNotice = function(item) {
          if (!item) return false;
          const str = typeof item === 'string' ? item : (item.message || item.stack || String(item));
          return str.includes('[vite]') || str.includes('failed to connect to websocket') || str.includes('WebSocket connection to');
        };
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isViteNotice)) return;
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isViteNotice)) return;
          origWarn.apply(console, args);
        };
        const origLog = console.log;
        console.log = function(...args) {
          if (args.some(isViteNotice)) return;
          origLog.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (isViteNotice(e.message) || isViteNotice(e.error) || isViteNotice(e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteNotice(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
