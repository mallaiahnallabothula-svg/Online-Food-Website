  <head>
    <script>
      (function() {
        var isViteMsg = function(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || (arg.toString ? arg.toString() : ''));
          return typeof str === 'string' && (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('vite-hmr') !== -1
          );
        };
        ['error', 'warn'].forEach(function(method) {
          var orig = console[method];
          if (orig) {
            console[method] = function() {
              for (var i = 0; i < arguments.length; i++) {
                if (isViteMsg(arguments[i])) return;
              }
              orig.apply(console, arguments);
            };
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (e && isViteMsg(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
