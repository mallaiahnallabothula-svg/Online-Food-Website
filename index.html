    <script>
      (function() {
        // Mock WebSocket for Vite HMR in environment where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const DummyWebSocket = function(url, protocols) {
            const isHmr = (Array.isArray(protocols) ? protocols.includes('vite-hmr') : protocols === 'vite-hmr') ||
                          (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));
            if (isHmr) {
              const target = new EventTarget();
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.readyState = 1;
              target.protocol = 'vite-hmr';
              target.url = String(url);
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new OrigWebSocket(url, protocols);
          };
          DummyWebSocket.CONNECTING = 0;
          DummyWebSocket.OPEN = 1;
          DummyWebSocket.CLOSING = 2;
          DummyWebSocket.CLOSED = 3;
          DummyWebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket = DummyWebSocket;
        }

        const isViteNotice = function(item) {
          if (!item) return false;
          try {
            const str = typeof item === 'string' ? item : (item.message || item.stack || JSON.stringify(item) || String(item));
            return str.includes('[vite]') || str.includes('failed to connect to websocket') || str.includes('WebSocket connection to');
          } catch (_) {
            return false;
          }
        };

        const methods = ['log', 'info', 'warn', 'error', 'debug'];
        methods.forEach(function(m) {
          const orig = console[m];
          if (orig) {
            console[m] = function(...args) {
              for (let i = 0; i < args.length; i++) {
                if (isViteNotice(args[i])) return;
              }
              orig.apply(console, args);
            };
          }
        });

        window.addEventListener('error', function(e) {
          if (isViteNotice(e.message) || isViteNotice(e.error) || isViteNotice(e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteNotice(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
